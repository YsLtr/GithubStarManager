name: Release

on:
  push:
    branches:
      - master
    paths:
      - package.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version change
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_version=$(git show "$BEFORE:package.json" | node -e "console.log(JSON.parse(require('fs').readFileSync(0, 'utf8')).version)")
          version=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version)")

          if [[ "$version" == "$previous_version" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "package.json changed, but the version did not; skipping release."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.version.outputs.changed == 'true'
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        if: steps.version.outputs.changed == 'true'
        with:
          version: 10.14.0

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Check and build
        if: steps.version.outputs.changed == 'true'
        run: pnpm check

      - name: Publish GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists without a release; refusing to publish against an unknown commit." >&2
            exit 1
          fi

          # 地址只有一个来源：产物头里的 @downloadURL（vite.config.ts 写入），这里只读不写
          INSTALL_URL=$(sed -n 's|^// @downloadURL *||p' dist/github-star-manager.user.js)
          test -n "$INSTALL_URL" || { echo "dist 头里没有 @downloadURL（生产构建才会写）" >&2; exit 1; }

          gh release create "$TAG" \
            dist/github-star-manager.user.js \
            --target "$GITHUB_SHA" \
            --title "GithubStarManager $VERSION" \
            --generate-notes

          # 安装与更新是同一个地址（latest 永久指向最新产物），前置到自动生成的 notes 之前
          {
            echo "## 安装 / 更新"
            echo
            echo "- 安装（Tampermonkey 点开即提示安装）：$INSTALL_URL"
            echo "- 更新：重新打开上面的地址即可覆盖安装；已启用「自动检查更新」的会自行提示"
            echo
            gh release view "$TAG" --json body -q .body
          } > release-body.md

          gh release edit "$TAG" --notes-file release-body.md
