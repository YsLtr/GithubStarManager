<!DOCTYPE html>

<head>
<meta charset="utf-8">
<title>repo detail smoke fixture</title>
<meta name="octolytics-dimension-user_id" content="999">
<meta name="octolytics-dimension-repository_id" content="123">
<meta name="octolytics-dimension-repository_nwo" content="alpha/one">
<script>
  window.__gmStore = {
    // 4.9.0 起详情页不再写缓存（extract.ts 已删），宽限期流程需要预置条目（模拟同步产物）
    stars_repo_cache: {
      '123': { name: 'alpha/one', desc: '第一个仓库的描述', stars: 29208, forks: 1024, updatedAt: '2026-09-20T13:25:54Z' }
    },
    stars_pending_delete: {},
    'stars_tags_999': { '123': ['ai', 'tool'] },
    'stars_notes_999': { '123': '这是备注' }
  };
  window.GM_getValue = function (key, def) {
    return key in window.__gmStore ? window.__gmStore[key] : def;
  };
  window.GM_setValue = function (key, value) { window.__gmStore[key] = value; };
  window.GM_addStyle = function (css) {
    const el = document.createElement('style');
    el.textContent = css;
    document.head.appendChild(el);
    return el;
  };
  window.addEventListener('error', (e) => {
    (window.__errors = window.__errors || []).push('onerror: ' + e.message);
  });
</script>
<!--
  新版 React 详情页把数据放在内嵌 JSON 里，侧栏类名是 CSS-module 哈希。
  旧选择器（.BorderGrid-cell / #repo-stars-counter-star / .starred form）在这里全部失配。
-->
<script type="application/json" data-target="react-app.embeddedData">
{"payload":{"codeViewLayoutRoute":{"repo":{"id":123,"name":"one","ownerLogin":"alpha","defaultBranch":"main"}},"sidebarAbout":{"description":"第一个仓库的描述","stargazerCount":29208,"watcherCount":42,"forksCount":1024,"ownerLogin":"alpha","repoName":"one","topics":[{"name":"ai"}],"repo":{"license":{"spdxId":"MIT"},"isArchived":false},"star":{"viewerHasStarred":true}}}}
</script>
